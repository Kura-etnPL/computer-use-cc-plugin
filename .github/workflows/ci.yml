name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON manifests
        shell: pwsh
        run: |
          Get-Content .mcp.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content .claude-plugin/plugin.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content .claude-plugin/marketplace.json -Raw | ConvertFrom-Json | Out-Null
      - name: Compile Python sources
        run: python -m compileall -q scripts
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Import smoke test
        env:
          PYAUTOGUI_FAILSAFE: "1"
        run: python -c "import fastmcp, pyautogui, pyperclip; print('imports ok')"
